name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Check that torch is not installed
        run: uv run python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('torch') is not None)"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
